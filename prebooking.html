<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/foundation.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/prebooking.css"><link rel="stylesheet" href="css/responsive.css"><title>PreBooking | NEURON Hospital</title></head><body data-title="PreBooking"><div id="header"></div><main><div class="container pb-shell">
<div class="page-title"><h1>PreBooking</h1><p>Request an appointment for an upcoming visit.</p></div>
<nav class="pb-nav" aria-label="PreBooking navigation"><a href="pending_appointments.html">Pending Appointments →</a><a href="index.html">Home</a></nav>
<section id="pbFormCard" class="pb-card"><h2>Patient Information</h2><p class="pb-muted">PreBooking is available without login. Enter and verify the WhatsApp number carefully.</p>
<form id="pbForm" novalidate><div class="pb-grid">
<div class="pb-field"><label for="pbName">Patient Name *</label><input id="pbName" maxlength="300" autocomplete="name" required><div class="pb-error" id="errName"></div></div>
<div class="pb-field"><label for="pbAge">Age *</label><div class="pb-inline"><input id="pbAge" inputmode="decimal" type="number" min="0" step="any" required><select id="pbAgeUnit" aria-label="Age unit"><option>Years</option><option>Months</option><option>Days</option></select></div><div class="pb-error" id="errAge"></div></div>
<div class="pb-field full"><label for="pbAddress">Address *</label><textarea id="pbAddress" maxlength="3000" autocomplete="street-address" required></textarea><div class="pb-error" id="errAddress"></div></div>
<div class="pb-field"><label for="pbMobile">WhatsApp Number *</label><input id="pbMobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" required><div class="pb-error" id="errMobile"></div></div>
<div class="pb-field"><label for="pbVerify">Verify WhatsApp Number *</label><input id="pbVerify" inputmode="numeric" autocomplete="off" maxlength="10" required><div class="pb-error" id="errVerify"></div></div>
<div class="pb-field"><label for="pbCity">Visiting City *</label><select id="pbCity" required></select><div class="pb-error" id="errCity"></div></div>
<div class="pb-field"><label for="pbDate">Visiting Date *</label><select id="pbDate" required></select><div class="pb-error" id="errDate"></div></div>
</div><div class="pb-actions"><button class="pb-primary" id="pbSubmit" type="submit">Submit PreBooking</button><button class="pb-secondary" id="pbClear" type="button">Clear Form</button></div><div id="pbFormStatus" class="pb-status" hidden role="status" aria-live="polite"></div></form></section>
<section id="pbOperation" class="pb-card" hidden><h2 id="pbOperationTitle">PreBooking status</h2><p class="pb-muted" id="pbOperationIntro"></p><div id="pbOperationDetails"></div><div class="pb-actions"><button id="pbCheckStatus" class="pb-secondary" type="button">Check Status</button><button id="pbRetrySame" class="pb-secondary" type="button" hidden>Retry Same Request</button><button id="pbNewRequest" class="pb-primary" type="button" hidden>New PreBooking</button></div><div id="pbOperationStatus" class="pb-status" role="status" aria-live="polite" hidden></div></section>
</div></main><div id="footer"></div><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/routes.js"></script><script src="js/foundation-ui.js"></script><script src="js/schedule.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/prebooking.js"></script></body></html>
