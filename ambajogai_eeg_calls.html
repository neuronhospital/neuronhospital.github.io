<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/foundation.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/ambajogai-eeg-calls.css"><link rel="stylesheet" href="css/responsive.css">
<title>Ambajogai EEG Calls | NEURON Hospital</title>
</head>
<body data-title="Ambajogai EEG Calls">
<div id="header"></div><main><div class="container">
<section class="page-title"><h1>Ambajogai EEG Calls</h1><p>Booking, monthly records and patient updates</p></section>
<section id="ambAccessStatus" class="card amb-status" role="status" aria-live="polite">Checking Ambajogai EEG Calls access…</section>
<div id="ambPortal" hidden>
<section class="card amb-tabs" aria-label="Ambajogai EEG Calls sections"><button id="ambBookingTab" class="amb-tab is-active" type="button">EEG Call Booking</button><button id="ambStatsTab" class="amb-tab" type="button">Stats</button></section>
<section id="ambBookingPanel" class="card">
<h2>Patient Details</h2><div class="grid">
<div class="field full"><label class="required-field" for="ambName">Patient Name</label><input id="ambName" maxlength="120" autocomplete="off"></div>
<div class="field"><label class="required-field" for="ambAge">Age</label><div class="input-row"><input id="ambAge" type="number" min="0.01" max="120" step="0.1" inputmode="decimal"><select id="ambAgeUnit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
<div class="field full"><label class="required-field" for="ambReferral">Referred By</label><input id="ambReferral" value="Dr Dahiphale Sir" maxlength="120"></div>
<div class="field full"><label class="required-field" for="ambTechnician">EEG Technician</label><input id="ambTechnician" maxlength="120"></div>
<div class="field full"><button id="ambBook" class="cta" type="button">Book Ambajogai EEG Call</button></div>
</div><p id="ambBookStatus" class="status" role="status" aria-live="polite"></p>
<div id="ambBookingRecovery" class="amb-recovery" hidden><p id="ambRecoveryText"></p><div class="amb-actions"><button id="ambCheckStatus" class="btn btn-secondary" type="button">Check Status</button><button id="ambRetrySame" class="btn btn-primary" type="button" hidden>Retry Same Request</button><button id="ambDiscardDraft" class="btn btn-secondary" type="button">Clear Draft</button></div></div>
<div id="ambConfirmation" class="amb-confirmation" hidden></div>
</section>
<section id="ambStatsPanel" class="card" hidden>
<div class="amb-panel-heading"><h2>Monthly EEG Calls</h2><button id="ambRefreshStats" class="btn btn-secondary" type="button">Refresh</button></div>
<section id="ambClearedWrap" class="amb-cleared" hidden><label for="ambClearedValue">EEG Calls Cleared</label><div class="input-row"><input id="ambClearedValue" maxlength="200"><button id="ambClearedUpdate" class="btn btn-primary" type="button">Update</button></div><p id="ambClearedStatus" class="status" role="status"></p></section>
<div id="ambStatsStatus" class="status" role="status" aria-live="polite"></div><div id="ambMonths"></div>
</section>
</div>
<section id="ambDenied" class="card amb-denied" hidden><h2>Access not enabled</h2><p>This account does not have permission to access Ambajogai EEG Calls. Contact the administrator.</p><a class="cta" href="index.html">Return to Home</a></section>
</div></main><div id="footer"></div>
<div id="ambEditDialog" class="amb-dialog-backdrop" hidden><section class="amb-dialog" role="dialog" aria-modal="true" aria-labelledby="ambEditTitle"><div class="amb-panel-heading"><h2 id="ambEditTitle">Update EEG Call</h2><button id="ambEditClose" class="btn btn-secondary" type="button">Close</button></div><p id="ambEditIdentity" class="amb-muted"></p><div class="grid"><div class="field full"><label class="required-field" for="ambEditName">Patient Name</label><input id="ambEditName" maxlength="120"></div><div class="field"><label class="required-field" for="ambEditAge">Age</label><div class="input-row"><input id="ambEditAge" type="number" min="0.01" max="120" step="0.1"><select id="ambEditUnit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div><div class="field full"><label class="required-field" for="ambEditReferral">Referred By</label><input id="ambEditReferral" maxlength="120"></div><div class="field full"><label class="required-field" for="ambEditTechnician">EEG Technician</label><input id="ambEditTechnician" maxlength="120"></div></div><p id="ambEditStatus" class="status" role="status" aria-live="polite"></p><div class="amb-actions"><button id="ambEditSave" class="btn btn-primary" type="button">Update</button><button id="ambEditCheck" class="btn btn-secondary" type="button" hidden>Check Update Status</button></div></section></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/routes.js"></script><script src="js/foundation-ui.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/ambajogai_eeg_calls.js"></script>
</body></html>
